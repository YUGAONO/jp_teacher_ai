version: "3.9"

services:
  backend:
    build: 
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: jp_teacher_backend_prod
    ports:
      - "8000:8000"
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://frontend
      - RELOAD_FLAG=
    env_file:
      - .env
    networks:
      - jp_teacher_network

  frontend:
    build:
      context: ./apps/frontend-vue
      dockerfile: Dockerfile
      target: production
    container_name: jp_teacher_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - jp_teacher_network

networks:
  jp_teacher_network:
    driver: bridge