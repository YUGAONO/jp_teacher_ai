version: "3.9"

services:
  fastapi:
    build: 
      context: ./apps/backend
    container_name: jp_teacher_fastapi
    ports:
      - "8000:8000"
    environment:
      # Docker環境では環境変数で上書き
      - FASTAPI_URL=http://fastapi:8000
      - BACKEND_URL=http://fastapi:8000
    env_file:
      - .env
    volumes:
      - ./apps/backend:/app

  streamlit:
    build:
      context: ./apps/frontend
    container_name: jp_teacher_streamlit
    ports:
      - "8501:8501"
    environment:
      # Docker環境では環境変数で上書き
      - FASTAPI_URL=http://fastapi:8000
      - BACKEND_URL=http://fastapi:8000
    env_file:
      - .env
    volumes:
      - ./apps/frontend:/app
    depends_on:
      - fastapi
