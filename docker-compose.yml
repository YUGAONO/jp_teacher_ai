version: "3.9"

services:
  backend:
    build: 
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: jp_teacher_backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://frontend:3000
      - RELOAD_FLAG=--reload
    env_file:
      - .env
    volumes:
      - ./apps/backend:/app
    networks:
      - jp_teacher_network

  frontend:
    build:
      context: ./apps/frontend-vue
      dockerfile: Dockerfile.dev
    container_name: jp_teacher_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./apps/frontend-vue:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - jp_teacher_network

networks:
  jp_teacher_network:
    driver: bridge
